name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      # Fully offline: the model is a scripted fake, so no API key is needed.
      - run: python -m pytest -v

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t support-agent .
      - name: Start container and check /health
        run: |
          docker run -d --name api -p 8000:8000 support-agent
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8000/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1