# docker compose up --build
# Put OPENAI_API_KEY=sk-... in a .env file next to this one (it's gitignored).
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - support-data:/data
    restart: unless-stopped

volumes:
  support-data:
